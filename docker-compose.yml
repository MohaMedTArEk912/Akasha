version: '3.8'

services:
  # Akasha web app runtime
  akasha:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akasha
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./akasha.db:/app/akasha.db
    environment:
      - AKASHA_HEADLESS=1
      - RUST_LOG=info
      - PORT=3001
    restart: unless-stopped
