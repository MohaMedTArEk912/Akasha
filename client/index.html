<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO Metadata -->
    <title>Akasha — Product Studio for Small Teams</title>
    <meta
      name="description"
      content="Turn small-team product ideas into vertical feature slices, clickable mock-API prototypes, shared data & REST contracts, and exportable full-stack apps."
    />
    <meta
      name="keywords"
      content="product studio, small team product development, prototype builder, mock api, feature slices, full-stack generator, mcp coding agents, ecommerce blueprint, internal tool builder"
    />
    <meta name="author" content="Akasha Studio" />
    <meta name="application-name" content="Akasha" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E7EAEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akasha" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Akasha — Product Studio for Small Teams" />
    <meta
      property="og:description"
      content="Go from product idea to clickable mock-API prototype, aligned feature slices, and full-stack code in one shared workspace."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Akasha — Product Studio for Small Teams" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akasha — Product Studio for Small Teams" />
    <meta
      name="twitter:description"
      content="Go from product idea to clickable mock-API prototype, aligned feature slices, and full-stack code in one shared workspace."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Akasha — Product Studio for Small Teams" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Akasha",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "Product operating system and studio for small teams to plan feature slices, run live stateful mock-API prototypes, track blueprint drift, and export full-stack applications.",
        "featureList": [
          "6 Product Archetype Starter Playbooks (E-Commerce, Internal Tools, Booking, SaaS, Marketplace, Marketing)",
          "Vertical Feature Slices with MVP voting, acceptance criteria, and ADR decisions",
          "Live Stateful Mock REST API server with realistic seeded records",
          "Connected Multi-Page Clickable Prototypes with shareable review links and pinned feedback",
          "Bi-directional MCP server for AI coding agents and full-stack code export"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frontend/index.tsx"></script>
  </body>
</html>
